<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Aksesa Admin</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
  body{background:linear-gradient(135deg,#FFE6F2 0%,#E6F0FF 100%);padding:20px;font-family:'Poppins'}
  header{display:flex;justify-content:space-between;background:rgba(255,255,255,0.8);padding:20px;border-radius:20px;margin-bottom:20px}
  h2{color:#FF82C1} 
  .menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
  .card{background:rgba(255,255,255,0.9);padding:25px;border-radius:20px;box-shadow:0 8px 25px rgba(182,219,255,0.2);cursor:pointer}
  .card h3{color:#FF82C1} .card p{color:#82B6FF}
  .btn-logout{padding:10px 20px;border:none;border-radius:15px;background:linear-gradient(90deg,#FF82C1,#82B6FF);color:white;cursor:pointer}
</style>
</head>
<body>
  <header>
    <h2>Dashboard Admin Aksesa</h2>
    <button class="btn-logout" onclick="window.location.href='login.html'">Logout</button>
  </header>
  <div class="menu">
    <div class="card" onclick="window.location.href='input.html'">
      <h3>📦 Input Barang</h3><p>Tambah anting, kalung, jepit, bando, dll</p>
    </div>
    <div class="card" onclick="alert('Fitur View Barang')">
      <h3>👀 View Barang</h3><p>Lihat semua stok aksesoris</p>
    </div>
    <div class="card" onclick="window.location.href='laporan.html'">
      <h3>📊 Laporan</h3><p>Lihat laporan Harian, Bulanan, Tahunan</p>
    </div>
  </div>
</body>
</html>
