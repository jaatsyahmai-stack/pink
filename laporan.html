<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laporan - Aksesa</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
  body{background:linear-gradient(135deg,#FFE6F2 0%,#E6F0FF 100%);padding:20px;font-family:'Poppins'}
  .box{background:rgba(255,255,255,0.9);padding:30px;border-radius:20px;max-width:600px;margin:auto;text-align:center}
  h2{color:#FF82C1}
  .btn{padding:14px;margin:10px;border:none;border-radius:15px;background:linear-gradient(90deg,#FF82C1,#82B6FF);color:white;font-weight:700;cursor:pointer;width:90%}
  .back{margin-top:10px;background:#82B6FF}
</style>
</head>
<body>
  <div class="box">
    <h2>📊 Laporan Penjualan</h2>
    <button class="btn" onclick="alert('Menampilkan Laporan Harian')">Laporan Harian</button>
    <button class="btn" onclick="alert('Menampilkan Laporan Bulanan')">Laporan Bulanan</button>
    <button class="btn" onclick="alert('Menampilkan Laporan Tahunan')">Laporan Tahunan</button>
    <button class="btn back" onclick="window.location.href='dashboard.html'">Kembali</button>
  </div>
</body>
</html>
