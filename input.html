<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Input Barang - Aksesa</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
  body{background:linear-gradient(135deg,#FFE6F2 0%,#E6F0FF 100%);padding:20px;font-family:'Poppins'}
  .box{background:rgba(255,255,255,0.9);padding:30px;border-radius:20px;max-width:500px;margin:auto}
  h2{color:#FF82C1;text-align:center}
  input,select{width:100%;padding:12px;border:2px solid #E6F0FF;border-radius:15px;margin-bottom:15px}
  .btn{padding:14px;border:none;border-radius:15px;background:linear-gradient(90deg,#FF82C1,#82B6FF);color:white;font-weight:700;cursor:pointer;width:100%}
  .back{margin-top:10px;background:#82B6FF}
</style>
</head>
<body>
  <div class="box">
    <h2>Input Barang Baru</h2>
    <input type="text" placeholder="Nama Barang: Anting, Kalung, Jepit...">
    <input type="number" placeholder="Harga">
    <input type="number" placeholder="Stok">
    <select><option>Jenis: Anting</option><option>Kalung</option><option>Jepit</option><option>Bando</option><option>Gelang</option><option>Kaca</option><option>Topi</option><option>Tumbler</option></select>
    <button class="btn" onclick="alert('Barang berhasil disimpan!')">Simpan Barang</button>
    <button class="btn back" onclick="window.location.href='dashboard.html'">Kembali</button>
  </div>
</body>
</html>
